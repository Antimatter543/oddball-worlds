[project]
name = "oddball-worlds"
version = "0.0.1"
description = "Searching TESS for weird exoplanet systems: exocomets, disintegrating planets and dippers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "astropy",
    "astroquery",
    "lightkurve",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddball"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
