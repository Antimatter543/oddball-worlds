[project]
name = "oddball-worlds"
version = "0.0.1"
description = "Searching TESS for weird exoplanet systems: exocomets, disintegrating planets and dippers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "astropy",
    "astroquery",
    "lightkurve",
    "matplotlib",
    "requests>=2.34.2",
    "tess-point>=0.9.5.post1",
]

[dependency-groups]
cloud = [
    "kaggle>=2.1",
]
dev = ["pytest", "ruff"]
ml = [
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "umap-learn>=0.5.12",
]
rubin = [
    "alerce>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddball"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
